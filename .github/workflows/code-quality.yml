name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.8.1

    - name: Check code formatting with black
      run: pixi run black --check src/ tests/

    - name: Check import sorting with isort
      run: pixi run isort --check-only src/ tests/

    - name: Lint with flake8
      run: |
        pixi run flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        pixi run flake8 src/ --count --exit-zero --max-complexity=15 --max-line-length=88 --statistics

    - name: Type check with mypy
      run: pixi run mypy src/lowrank --ignore-missing-imports
