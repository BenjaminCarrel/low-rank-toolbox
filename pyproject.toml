# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lowrank" # The name used for `pip install`
version = "0.1.0"
authors = [
    { name="Benjamin Carrel", email="benjamin.carrel@psi.ch" },
]
description = "A Python library for efficient low-rank matrix and tensor operations."
readme = "README.md"
requires-python = ">=3.10"
license = { file="LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License", # Or another license like BSD-3-Clause
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Core dependencies your library needs to run
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/BenjaminCarrel/low-rank-toolbox"
"Bug Tracker" = "https://github.com/BenjaminCarrel/low-rank-toolbox/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
